services:
  db:
    image: postgres:16
    container_name: aura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your private .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your private .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env file}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data

volumes:
  aura_postgres_data:
